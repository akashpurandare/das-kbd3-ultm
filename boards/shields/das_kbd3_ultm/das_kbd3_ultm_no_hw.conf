# Debug build override — no PCB/header-pins connected
# Prevents firmware from entering soft power-off (needs I2C-backed kscan wakeup
# source, which is unavailable without hardware), which would kill USB before
# macOS can enumerate the CDC ACM port.
CONFIG_ZMK_PM_SOFT_OFF=n

# BLE disabled — USB-only mode, simplifies startup path
CONFIG_ZMK_BLE=n

# LED indicators reference MCP23017 nodes which are disabled in the overlay.
# Disable the feature so ZMK never calls DEVICE_DT_GET on the LED device.
CONFIG_ZMK_HID_INDICATORS=n

# Belt-and-suspenders: if for any reason I2C is still exercised, fail fast.
CONFIG_I2C_NRFX_TRANSFER_TIMEOUT=1
