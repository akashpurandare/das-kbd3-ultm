# Das Keyboard 3.0 Ultimate — ZMK shield Kconfig fragment
# See https://zmk.dev/docs/config for all options.

# ── Keyboard identity ──────────────────────────────────────────────────────────
CONFIG_ZMK_KEYBOARD_NAME="Das Keyboard 3"

# ── Bluetooth ──────────────────────────────────────────────────────────────────
CONFIG_ZMK_BLE=y
CONFIG_BT_DEVICE_NAME="Das Keyboard 3"

# ── USB (wired HID via CH334F hub) ────────────────────────────────────────────
CONFIG_ZMK_USB=y

# ── OLED display (SSD1306 128×32 on I²C) ──────────────────────────────────────
# Requires 4.7 kΩ pull-up resistors on SDA and SCL to 3.3 V on the PCB.
# Only OLED requires these pull-ups; MCPs and MAX17048 do not (they are
# open-drain with internal logic). Fit them and enable the ssd1306@3c node.
CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_WIDGET_BATTERY_STATUS=y
CONFIG_ZMK_WIDGET_OUTPUT_STATUS=y
# Uncomment to show layer name on OLED (define layer names in keymap):
# CONFIG_ZMK_WIDGET_LAYER_STATUS=y

# ── HID lock-state indicator LEDs (NumLk / CapsLk / ScrlLk) ──────────────────
CONFIG_ZMK_HID_INDICATORS=y

# ── Software power-off / bootloader integration ───────────────────────────────
# Enables ZMK soft power-off so the keyboard can sleep on battery.
# Wake-up source is the key matrix (defined via soft_off_wakers in overlay).
CONFIG_ZMK_PM_SOFT_OFF=y

# ── I²C (MCP23017 GPIO expanders) ─────────────────────────────────────────────
CONFIG_I2C=y

# ── MCP23017 GPIO expander driver ─────────────────────────────────────────────
CONFIG_GPIO_MCP230XX=y

# ── MCP23017 interrupt support (enables int-gpios driven GPIO callbacks) ───────
# Required for interrupt-driven kscan: MCP asserts INT when a row pin changes.
# Uses 4.7 kΩ external pull-up resistors to 3.3 V on each INT line on the PCB.
CONFIG_GPIO_MCP230XX_INTERRUPT=y
